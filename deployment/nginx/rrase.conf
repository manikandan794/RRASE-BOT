# Example Nginx site config for the RRASE College AI Assistant.
#
# Local Docker Compose usage (HTTP only, port 80) - see docker-compose.yml.
# For production behind the college's own domain, copy this file to
# /etc/nginx/sites-available/chatbot.rrase.com, adjust `server_name` and
# the certificate paths below, then symlink it into sites-enabled and run
# `certbot --nginx` (see docs/deployment.md for the full walkthrough).

server {
    listen 80;
    # Replace with your real subdomain in production, e.g. chatbot.rrase.com
    server_name _;

    client_max_body_size 25M;

    # Static frontend
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}


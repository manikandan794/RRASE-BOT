<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - RRASE College AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg rrase-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">RRASE College AI Assistant</a>
    </div>
  </nav>
  <div class="container py-5" style="max-width: 420px;">
    <div class="rrase-card p-4">
      <h1 class="h4 mb-3 text-center">Create your student account</h1>
      <div id="regError" class="alert alert-danger d-none"></div>
      <div id="regSuccess" class="alert alert-success d-none"></div>
      <form id="regForm">
        <div class="mb-3">
          <label class="form-label small">Full name</label>
          <input type="text" class="form-control" id="fullName" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Email</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Password (min 8 characters)</label>
          <input type="password" class="form-control" id="password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account</button>
      </form>
      <hr />
      <p class="small text-center text-secondary mb-0">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("regError");
      const successBox = document.getElementById("regSuccess");
      errorBox.classList.add("d-none");
      successBox.classList.add("d-none");
      try {
        await window.RraseAPI.register(
          document.getElementById("email").value.trim(),
          document.getElementById("fullName").value.trim(),
          document.getElementById("password").value
        );
        successBox.textContent = "Account created! Redirecting to sign in...";
        successBox.classList.remove("d-none");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        errorBox.textContent = err.message || "Registration failed.";
        errorBox.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>

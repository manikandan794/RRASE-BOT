<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RRASE College AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg rrase-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>RRASE College AI Assistant</a>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 420px;">
    <div class="rrase-card p-4">
      <h1 class="h4 mb-3 text-center">Sign in</h1>
      <p class="text-secondary small text-center">
        Students, faculty, admin, and principal all sign in here — you'll
        land on the dashboard for your role automatically.
      </p>
      <div id="loginError" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small">Email</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
      <hr />
      <p class="small text-center text-secondary mb-0">
        New student? <a href="register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("loginError");
      errorBox.classList.add("d-none");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const data = await window.RraseAPI.login(email, password);
        if (data.roles.includes("admin")) window.location.href = "admin/index.html";
        else if (data.roles.includes("principal")) window.location.href = "principal/index.html";
        else if (data.roles.includes("faculty")) window.location.href = "faculty/index.html";
        else window.location.href = "chat.html";
      } catch (err) {
        errorBox.textContent = err.message || "Login failed.";
        errorBox.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
